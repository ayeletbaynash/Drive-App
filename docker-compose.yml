services:
  # TCP storage server (C++ server)
  tcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - tcp_storage:/usr/src/mytest/app

  # Web API server (Node.js + Express)
  web-server:
    build:
      context: .
      dockerfile: Dockerfile.node
    ports:
      - "8080:3000"
    environment:
      - TCP_HOST=tcp-server
    depends_on:
      - tcp-server
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/web         

  # React Frontend
  react-frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.react
    ports:
      - "3001:3000"
    volumes:
      - ./web:/usr/src/app        
      - /usr/src/app/node_modules  
    environment:
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NODE_OPTIONS=--max-old-space-size=1024
    depends_on:
      - web-server

  # Mobile 
  mobile-app:
    build:
      context: ./mobile
      dockerfile: dockerfile.reactNative
    ports:
      - "8081:8081" 
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=${MY_IP}
    tty: true #allow to see the barkod in the terminal
    stdin_open: true  #allow interaction with the terminal
    volumes:
      - ./mobile:/app
      - /app/node_modules
    depends_on:
      - web-server


volumes:
  tcp_storage: