services:
  # TCP storage server (C++ server)
  tcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - tcp_storage:/usr/src/mytest/app

  # Web API server (Node.js + Express)
  web-server:
    build:
      context: .
      dockerfile: Dockerfile.node
    ports:
      - "8080:3000"
    environment:
      - TCP_HOST=tcp-server
    depends_on:
      - tcp-server

  # React Frontend
  react-frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.react
    ports:
      - "3001:3000"
    depends_on:
      - web-server

volumes:
  tcp_storage: