services:
  # TCP storage server (C++ server from previous exercise)
  tcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - tcp_storage:/usr/src/mytest/app

  # Web API server (Node.js + Express)
  web-server:
    build:
      context: .
      dockerfile: Dockerfile.node
    ports:
      - "3000:3000"
    environment:
      - TCP_HOST=tcp-server
    depends_on:
      - tcp-server

volumes:
  # Named volume to persist TCP server data across container restarts
  tcp_storage: