services:
  # TCP storage server (C++ server)
  tcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - tcp_storage:/usr/src/mytest/app

  # Web API server (Node.js + Express)
  web-server:
    build:
      context: .
      dockerfile: Dockerfile.node
    ports:
      - "8080:3000"
    environment:
      - TCP_HOST=tcp-server
      - CONNECTION_STRING=mongodb://db:27017/googleDriveDB
      - PORT=3000
      - NODE_OPTIONS=--max-old-space-size=1024
    depends_on:
      - tcp-server
      - db
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  # Mobile 
  mobile-app:
    build:
      context: ./mobile
      dockerfile: dockerfile.reactNative
    ports:
      - "8081:8081" 
    environment:
      - CHOKIDAR_USEPOLLING=true
      - GENERATE_SOURCEMAP=false  
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=0
      - NODE_OPTIONS=--max-old-space-size=4096
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=${MY_IP}
    volumes:
      - ./mobile:/app
      - /app/node_modules
    depends_on:
      - web-server
    tty: true
    stdin_open: true

  # MongoDB Database service
  db:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - drive-db-data:/data/db
    tty: true #allow to see the barkod in the terminal
    stdin_open: true  #allow interaction with the terminal
    mem_limit: 2048m


volumes:
  tcp_storage:
  drive-db-data: