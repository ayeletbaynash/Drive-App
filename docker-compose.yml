services:
  # TCP storage server (C++ server)
  tcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - tcp_storage:/usr/src/mytest/app

  # Web API server (Node.js + Express)
  web-server:
    build:
      context: .
      dockerfile: Dockerfile.node
    ports:
      - "8080:3000"
    environment:
      - TCP_HOST=tcp-server
      - CONNECTION_STRING=mongodb://db:27017/googleDriveDB
      - PORT=3000
      - NODE_OPTIONS=--max-old-space-size=1024
    depends_on:
      - tcp-server
      - db
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  # # React Frontend
  # react-frontend:
  #   build:
  #     context: ./web
  #     dockerfile: Dockerfile.react
  #   ports:
  #     - "3001:3000"
  #   volumes:
  #     - ./web:/usr/src/app        
  #     - /usr/src/app/node_modules  
  #   environment:
  #     - HOST=0.0.0.0
  #     - NODE_OPTIONS=--max-old-space-size=4096 # הגדלה ל-4GB עבור הקומפילציה
  #     - CHOKIDAR_USEPOLLING=true # חיוני למניעת ENOMEM ב-Windows
  #     - WATCHPACK_POLLING=true   # חיוני למניעת ENOMEM ב-Windows
  #     - WDS_SOCKET_PORT=0        # מונע שגיאות חיבור בדפדפן
  #     - FAST_REFRESH=false       # במידת הצורך, מכבה רענון אגרסיבי שצורך זיכרון
  #   mem_limit: 4096m             # הגבלה פיזית של הקונטיינר
  #   depends_on:
  #     - web-server

  # Mobile 
  mobile-app:
    build:
      context: ./mobile
      dockerfile: dockerfile.reactNative
    ports:
      - "8081:8081" 
    environment:
      - CHOKIDAR_USEPOLLING=true
      - GENERATE_SOURCEMAP=false  
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=0
      - NODE_OPTIONS=--max-old-space-size=4096
    depends_on:
      - web-server

  # MongoDB Database service
  db:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - drive-db-data:/data/db
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=${MY_IP}
      - NODE_OPTIONS=--max-old-space-size=2048
      - WATCHPACK_POLLING=true
    tty: true #allow to see the barkod in the terminal
    stdin_open: true  #allow interaction with the terminal
    volumes:
      - ./mobile:/app
      - /app/node_modules
    mem_limit: 2048m
    depends_on:
      - web-server


volumes:
  tcp_storage:
  drive-db-data: